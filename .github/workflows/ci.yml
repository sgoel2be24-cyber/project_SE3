name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matching-service:
    name: Matching service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matching-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: matching-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  backend:
    name: Backend API (Node + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: foodbridge
          POSTGRES_PASSWORD: foodbridge
          POSTGRES_DB: foodbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://foodbridge:foodbridge@localhost:5432/foodbridge_test
      MATCHER_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      # Backend integration tests call the real matching service on :8000.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start matching service
        working-directory: matching-service
        run: |
          pip install -r requirements.txt
          nohup uvicorn app:app --port 8000 > /tmp/matcher.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Tests
        working-directory: backend
        run: npm test
      - name: Matcher log (on failure)
        if: failure()
        run: cat /tmp/matcher.log

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
